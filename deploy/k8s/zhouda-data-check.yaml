---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ZhoudaDataCheck
  name: ZhoudaDataCheck
  namespace: bigdata
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s.kuboard.cn/layer: svc
      k8s.kuboard.cn/name: ZhoudaDataCheck
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        k8s.kuboard.cn/layer: svc
        k8s.kuboard.cn/name: ZhoudaDataCheck
    spec:
      containers:
        - args:
            - start_container
            - ''
          command:
            - zhoudaDataCheck-1.0.0-bin/bin/zhouda-data-check-daemon.sh
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: SPRING_DATASOURCE_URL
              value: >-
                jdbc:mysql://mysql:3306/ZhoudaDataCheck?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: 123456
          image: 'zhouda-data-check:1.0.0'
          imagePullPolicy: IfNotPresent
          name: ZhoudaDataCheck
          resources: {}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ZhoudaDataCheck
  name: ZhoudaDataCheck
  namespace: bigdata
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: web
      port: 5600
      protocol: TCP
      targetPort: 5600
  selector:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ZhoudaDataCheck
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations: {}
  labels:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ZhoudaDataCheck
  name: ZhoudaDataCheck
  namespace: bigdata
spec:
  ingressClassName: nginx
  rules:
    - host: zhouda-data-check.local
      http:
        paths:
          - backend:
              service:
                name: ZhoudaDataCheck
                port:
                  number: 5600
            path: /
            pathType: Prefix

